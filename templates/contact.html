{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Contact" %} | RoomMate Finder{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 600px;">
    <h1 class="h3 mb-3">{% trans "Contact us" %}</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-coral">{% trans "Send message" %}</button>
    </form>
</div>
{% endblock %}
