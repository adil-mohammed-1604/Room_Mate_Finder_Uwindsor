{% extends "base.html" %}

{% block title %}{{ title }} | RoomMate Finder{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 640px;">
    <h1 class="h3 mb-3">{{ title }}</h1>
    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        <h2 class="h5">About you</h2>
        {{ pform.as_p }}
        <h2 class="h5 mt-4">Lifestyle</h2>
        {{ lform.as_p }}
        <button type="submit" class="btn btn-coral">Save profile</button>
        {% if user.profile %}
            <a href="{% url 'profile_delete' %}" class="btn btn-outline-danger ms-2">Delete profile</a>
        {% endif %}
    </form>
</div>
{% endblock %}
