{% extends "base.html" %}

{% block title %}Delete profile | RoomMate Finder{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 520px;">
    <h1 class="h3 mb-3">Delete your profile?</h1>
    <p>This removes your profile and lifestyle preferences. Your account stays active.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'home' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
